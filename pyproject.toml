[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acplint"
version = "0.2.0"
description = "The linter for the Agent Client Protocol (ACP) — validate your AI agent against the ACP spec"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
acplint = "acplint.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
